name: Windows-Test
on: workflow_dispatch

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: OpenCode installieren
        shell: pwsh
        run: npm install -g opencode-ai

      - name: Version prüfen
        shell: pwsh
        run: opencode --version

      - name: AGENTS.md vorhanden?
        shell: pwsh
        run: |
          if (Test-Path AGENTS.md) { "AGENTS.md gefunden" } else { throw "AGENTS.md fehlt" }
          Get-Content AGENTS.md -TotalCount 3
